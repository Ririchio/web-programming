{% load static %}
{% load book_tags %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Каталог книг{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'books/style.css' %}">
</head>
<body>

<header>
    <div class="container">
        <h1>Книжная полка</h1>
    </div>
</header>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

<footer>
    <div class="container">
        {% current_year %} · Каталог книг
    </div>
</footer>

</body>
</html>
